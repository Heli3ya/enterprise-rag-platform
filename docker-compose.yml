
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama-model-init:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull "$${LLM_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy

  ai_service:
    image: enterprise-rag-ai:latest
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/api}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ai_model_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m

  django:
    image: enterprise-rag-django:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AI_SERVICE_URL: http://ai_service:8001
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 2
        --access-logfile -
        --error-logfile -

volumes:
  postgres_data:
  redis_data:
  media_data:
  ai_model_cache:
  ollama_data:
