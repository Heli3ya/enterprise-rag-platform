
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Django Tests and Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: enterprise_rag
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enterprise_rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DB_NAME: enterprise_rag
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      SENTRY_DSN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install \
            Django==6.0.7 \
            django-cors-headers==4.9.0 \
            django-prometheus==2.5.0 \
            djangorestframework==3.17.1 \
            djangorestframework_simplejwt==5.5.1 \
            drf-spectacular==0.30.0 \
            pgvector==0.5.0 \
            psycopg2-binary==2.9.12 \
            python-dotenv==1.2.2 \
            sentry-sdk==2.71.0 \
            redis==8.1.0 \
            celery==5.6.3 \
            pypdf==6.15.0 \
            python-docx==1.2.0 \
            tiktoken==0.11.0 \
            python-magic \
            flake8==7.3.0

      - name: Prepare PostgreSQL test template
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres \
            -T template0 enterprise_rag_test_template
          psql -h localhost -U postgres \
            -d enterprise_rag_test_template \
            -c "CREATE EXTENSION vector;"

      - name: Run Flake8
        run: |
          python -m flake8 api documents accounts departments config tests \
            --select=F821,F822 \
            --exclude='*/migrations/*'

      - name: Run Django tests
        run: python -m pytest
