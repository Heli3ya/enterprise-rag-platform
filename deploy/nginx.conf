
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # General API rate limit: 10 requests per second per IP.
    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=10r/s;

    # Count only POST requests for the upload-specific limit.
    # Empty keys are not counted.
    map $request_method $upload_limit_key {
        default "";
        POST    $binary_remote_addr;
    }

    # Upload limit: 2 POST requests per minute per IP on average.
    limit_req_zone $upload_limit_key
        zone=upload_limit:10m
        rate=2r/m;

    # Django backend.
    upstream django_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;

        # Allow multipart overhead for Django's 5 MB file limit.
        client_max_body_size 6m;

        # Document endpoints, including upload, status and delete.
        location ^~ /api/documents/ {
            # General API protection.
            limit_req zone=api_limit burst=20 nodelay;

            # Extra protection for POST requests only.
            limit_req zone=upload_limit burst=3 nodelay;

            limit_req_status 429;

            proxy_pass http://django_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Other Django API endpoints.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://django_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Do not expose uploaded documents or other files publicly.
        # Configure the frontend separately when deploying it.
        location / {
            return 404;
        }
    }
}
